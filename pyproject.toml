[project]
name = "xbrlbench"
version = "0.1.0"
description = "A benchmark for evaluating LLM financial reasoning over real SEC XBRL filing data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Allison" }]
# Runtime is deliberately stdlib-only — no requests/pandas/pydantic — so a
# clone needs nothing beyond Python itself to run the benchmark.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# RL training (scripts/train_grpo.py). Pinned to the versions the script was
# written against; vLLM is installed separately on the GPU machine.
train = ["trl==1.17.1", "peft==0.21.2", "transformers>=4.56.2", "datasets>=4.7.0", "accelerate>=1.11.0"]

[project.scripts]
xbrlbench = "xbrlbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xbrlbench*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# pyflakes + pycodestyle errors, import sorting, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]
# Long lines are common in the prose-heavy docstrings and question templates.
ignore = ["E501"]
